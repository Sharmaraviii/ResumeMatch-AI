services:
  api:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      HF_HOME: /tmp/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - ollama
  ui:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
volumes:
  ollama_models:
